<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>freeCivilcad LLM 命令映射 POC</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; overflow: hidden; background: #1e1e2e; color: #cdd6f4; }
#app { display: flex; height: 100vh; }
#canvas-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#toolbar {
  height: 44px; background: #181825; border-bottom: 1px solid #313246;
  display: flex; align-items: center; padding: 0 12px; gap: 8px; flex-shrink: 0;
}
#toolbar .brand { font-weight: bold; font-size: 14px; margin-right: 8px; color: #89b4fa; }
#toolbar .info { margin-left: auto; font-size: 11px; color: #a6adc8; display: flex; gap: 12px; align-items: center; }
#toolbar .coord { color: #89b4fa; }
.tool-btn {
  padding: 4px 12px; border: 1px solid #45475a; border-radius: 4px;
  background: #313244; color: #cdd6f4; cursor: pointer; font-size: 12px; transition: all 0.15s;
}
.tool-btn:hover { background: #45475a; }
.tool-btn.active { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
#canvas-container { flex: 1; overflow: hidden; position: relative; }
canvas { display: block; }

#chat-panel {
  width: 380px; min-width: 320px; background: #181825; border-left: 1px solid #313246;
  display: flex; flex-direction: column; flex-shrink: 0;
}
#chat-header {
  padding: 12px 16px; border-bottom: 1px solid #313246; font-size: 13px; font-weight: bold;
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
#chat-header .badge {
  font-size: 10px; background: #89b4fa; color: #1e1e2e; padding: 2px 8px;
  border-radius: 10px; font-weight: 600;
}
#chat-messages {
  flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
}
#chat-messages::-webkit-scrollbar { width: 4px; }
#chat-messages::-webkit-scrollbar-track { background: transparent; }
#chat-messages::-webkit-scrollbar-thumb { background: #45475a; border-radius: 2px; }
.msg { max-width: 100%; font-size: 13px; line-height: 1.5; }
.msg.user { align-self: flex-end; }
.msg.user .bubble {
  background: #89b4fa; color: #1e1e2e; padding: 8px 14px; border-radius: 14px 14px 4px 14px;
  display: inline-block; max-width: 100%; word-break: break-word;
}
.msg.system { align-self: flex-start; }
.msg.system .bubble {
  background: #313244; color: #cdd6f4; padding: 8px 14px; border-radius: 14px 14px 14px 4px;
  display: inline-block; max-width: 100%; word-break: break-word;
}
.msg.system .bubble .json-block {
  background: #1e1e2e; border: 1px solid #45475a; border-radius: 4px;
  padding: 6px 10px; margin: 6px 0 4px; font-family: "Cascadia Code", "Consolas", monospace;
  font-size: 11px; color: #a6e3a1; overflow-x: auto; white-space: pre-wrap;
}
.msg.system .bubble .result-ok { color: #a6e3a1; }
.msg.system .bubble .result-fail { color: #f38ba8; }
.msg.system .bubble .timestamp { color: #585b70; font-size: 10px; margin-top: 4px; display: block; }
.msg.system .bubble .detail { margin: 2px 0; font-size: 11px; }

#chat-input-area {
  padding: 10px 12px; border-top: 1px solid #313246; display: flex; gap: 8px; flex-shrink: 0;
}
#chat-input {
  flex: 1; background: #313244; border: 1px solid #45475a; border-radius: 8px;
  padding: 8px 12px; color: #cdd6f4; font-size: 13px; outline: none; font-family: inherit;
}
#chat-input:focus { border-color: #89b4fa; }
#chat-input::placeholder { color: #585b70; }
#send-btn {
  padding: 8px 18px; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s;
}
#send-btn:hover { background: #74c7ec; }
#send-btn:disabled { opacity: 0.5; cursor: default; }

.msg-hint {
  font-size: 11px; color: #585b70; text-align: center; padding: 4px 0;
}
</style>
</head>
<body>
<div id="app">
  <div id="canvas-area">
    <div id="toolbar">
      <span class="brand">freeCivilcad</span>
      <button class="tool-btn active" id="grid-toggle">網格</button>
      <button class="tool-btn" id="zoom-reset">1:1</button>
      <button class="tool-btn" id="clear-all">清空</button>
      <span class="info">
        <span class="coord" id="mouse-coords">X: 0.0, Y: 0.0</span>
        <span id="entity-count">圖元: 0</span>
      </span>
    </div>
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <div id="chat-panel">
    <div id="chat-header">
      <span>LLM 命令</span>
      <span class="badge">NL → CAD</span>
    </div>
    <div id="chat-messages">
      <div class="msg system">
        <div class="bubble">
          歡迎使用 LLM 命令映射！輸入自然語言繪圖指令，例如：<br>
          「畫一條線從 0,0 到 100,100」<br>
          「畫一個圓心在 50,50 半徑 30 的圓」
        </div>
      </div>
    </div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="輸入繪圖指令..." autofocus>
      <button id="send-btn">傳送</button>
    </div>
  </div>
</div>

<script src="src/executor.js"></script>
<script>
(function() {
  "use strict";

  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

  const DEFAULT_COLORS = { LINE: '#f38ba8', CIRCLE: '#89b4fa', ARC: '#f9e2af', POLYGON: '#a6e3a1', TEXT: '#f5c2e7' };

  const container = document.getElementById('canvas-container');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const snapshotCanvas = document.createElement('canvas');
  const snapshotCtx = snapshotCanvas.getContext('2d');
  let snapshotValid = false;

  function resizeCanvas() {
    const w = container.clientWidth, h = container.clientHeight;
    canvas.width = w; canvas.height = h;
    snapshotCanvas.width = w; snapshotCanvas.height = h;
    snapshotValid = false;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function invalidateSnapshot() { snapshotValid = false; }

  function screenToWorld(sx, sy) {
    return { x: (sx - state.panX) / (state.zoom * state.gridSize), y: (sy - state.panY) / (state.zoom * state.gridSize) };
  }
  function worldToScreen(wx, wy) {
    return { x: wx * state.zoom * state.gridSize + state.panX, y: wy * state.zoom * state.gridSize + state.panY };
  }

  const state = {
    entities: [], selectedEntity: null,
    showGrid: true, gridSize: 20, zoom: 1, panX: 0, panY: 0,
    mouseScreenX: 0, mouseScreenY: 0
  };

  function ptSegDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const ls = dx * dx + dy * dy;
    if (ls === 0) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * dx + (py - ay) * dy) / ls;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  function normA(a) { return ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI); }

  function hitTest(wx, wy) {
    const th = 8 / (state.zoom * state.gridSize);
    for (let i = state.entities.length - 1; i >= 0; i--) {
      const e = state.entities[i];
      if (e.type === 'LINE') {
        if (ptSegDist(wx, wy, e.x1, e.y1, e.x2, e.y2) < th) return e;
      } else if (e.type === 'CIRCLE') {
        if (Math.abs(Math.hypot(wx - e.cx, wy - e.cy) - e.radius) < th) return e;
      } else if (e.type === 'ARC') {
        const d = Math.hypot(wx - e.cx, wy - e.cy);
        if (Math.abs(d - e.radius) < th) {
          let a = Math.atan2(wy - e.cy, wx - e.cx);
          let sa = normA(e.startAngle), ea = normA(e.endAngle), aa = normA(a);
          if (sa <= ea) { if (aa >= sa && aa <= ea) return e; }
          else { if (aa >= sa || aa <= ea) return e; }
        }
      } else if (e.type === 'POLYGON') {
        for (let j = 0; j < e.vertices.length; j++) {
          const k = (j + 1) % e.vertices.length;
          if (ptSegDist(wx, wy, e.vertices[j].x, e.vertices[j].y, e.vertices[k].x, e.vertices[k].y) < th) return e;
        }
      } else if (e.type === 'TEXT') {
        if (Math.hypot(wx - e.x, wy - e.y) < th * 3) return e;
      }
    }
    return null;
  }

  function drawGridTo(c) {
    if (!state.showGrid) return;
    const g = state.gridSize, w = canvas.width, h = canvas.height;
    c.save();
    c.lineWidth = 0.5;
    c.strokeStyle = '#2a2a3a';
    c.beginPath();
    const ox = state.panX % (g * 5 * state.zoom), oy = state.panY % (g * 5 * state.zoom);
    for (let x = ox; x < w; x += g * 5 * state.zoom) { c.moveTo(x, 0); c.lineTo(x, h); }
    for (let y = oy; y < h; y += g * 5 * state.zoom) { c.moveTo(0, y); c.lineTo(w, y); }
    c.stroke();
    c.strokeStyle = '#222236';
    c.beginPath();
    for (let x = state.panX % (g * state.zoom); x < w; x += g * state.zoom) { c.moveTo(x, 0); c.lineTo(x, h); }
    for (let y = state.panY % (g * state.zoom); y < h; y += g * state.zoom) { c.moveTo(0, y); c.lineTo(w, y); }
    c.stroke();
    const o = worldToScreen(0, 0);
    c.strokeStyle = '#585b70'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(o.x, 0); c.lineTo(o.x, h); c.moveTo(0, o.y); c.lineTo(w, o.y); c.stroke();
    c.restore();
  }

  function drawEntityTo(c, entity, highlight) {
    c.save();
    c.strokeStyle = entity.color;
    c.lineWidth = (entity.lineWidth || 2) * state.zoom;
    c.lineCap = 'round';
    if (highlight) {
      c.shadowColor = entity.color; c.shadowBlur = 12;
      c.strokeStyle = '#ffffff'; c.lineWidth = (entity.lineWidth || 2) * state.zoom * 1.3;
    }
    if (entity.type === 'LINE') {
      const s1 = worldToScreen(entity.x1, entity.y1), s2 = worldToScreen(entity.x2, entity.y2);
      c.beginPath(); c.moveTo(s1.x, s1.y); c.lineTo(s2.x, s2.y); c.stroke();
    } else if (entity.type === 'CIRCLE') {
      const s = worldToScreen(entity.cx, entity.cy), r = entity.radius * state.zoom * state.gridSize;
      c.beginPath(); c.arc(s.x, s.y, r, 0, Math.PI * 2); c.stroke();
      if (!highlight) { c.fillStyle = entity.color; c.beginPath(); c.arc(s.x, s.y, 3 * state.zoom, 0, Math.PI * 2); c.fill(); }
    } else if (entity.type === 'ARC') {
      const s = worldToScreen(entity.cx, entity.cy), r = entity.radius * state.zoom * state.gridSize;
      const sa = entity.startAngle, ea = entity.endAngle;
      c.beginPath(); c.arc(s.x, s.y, r, sa, ea); c.stroke();
      if (!highlight) {
        c.fillStyle = entity.color;
        const e1 = worldToScreen(entity.cx + entity.radius * Math.cos(sa), entity.cy + entity.radius * Math.sin(sa));
        const e2 = worldToScreen(entity.cx + entity.radius * Math.cos(ea), entity.cy + entity.radius * Math.sin(ea));
        c.beginPath(); c.arc(e1.x, e1.y, 3 * state.zoom, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(e2.x, e2.y, 3 * state.zoom, 0, Math.PI * 2); c.fill();
      }
    } else if (entity.type === 'POLYGON') {
      const verts = entity.vertices;
      if (verts.length < 2) { c.restore(); return; }
      c.beginPath();
      const p0 = worldToScreen(verts[0].x, verts[0].y);
      c.moveTo(p0.x, p0.y);
      for (let i = 1; i < verts.length; i++) {
        const p = worldToScreen(verts[i].x, verts[i].y);
        c.lineTo(p.x, p.y);
      }
      c.closePath(); c.stroke();
      if (!highlight) {
        c.fillStyle = entity.color; c.globalAlpha = 0.08;
        c.fill(); c.globalAlpha = 1;
        for (const v of verts) {
          const p = worldToScreen(v.x, v.y);
          c.beginPath(); c.arc(p.x, p.y, 3 * state.zoom, 0, Math.PI * 2); c.fill();
        }
      }
    } else if (entity.type === 'TEXT') {
      if (entity.text) {
        const p = worldToScreen(entity.x, entity.y);
        const fs = (entity.fontSize || 1) * state.zoom * state.gridSize;
        c.font = fs + 'px "Microsoft JhengHei", sans-serif';
        c.fillStyle = highlight ? '#ffffff' : entity.color;
        c.textBaseline = 'bottom';
        c.fillText(entity.text, p.x, p.y);
      }
    }
    c.restore();
  }

  function drawSelectionBoxTo(c, entity) {
    c.save();
    c.strokeStyle = '#89b4fa'; c.lineWidth = 1.5; c.setLineDash([5, 3]);
    let b;
    if (entity.type === 'LINE') {
      const s1 = worldToScreen(entity.x1, entity.y1), s2 = worldToScreen(entity.x2, entity.y2);
      b = { l: Math.min(s1.x, s2.x), t: Math.min(s1.y, s2.y), r: Math.max(s1.x, s2.x), btm: Math.max(s1.y, s2.y) };
    } else if (entity.type === 'CIRCLE' || entity.type === 'ARC') {
      const s = worldToScreen(entity.cx, entity.cy), r = (entity.radius || 0) * state.zoom * state.gridSize;
      b = { l: s.x - r, t: s.y - r, r: s.x + r, btm: s.y + r };
    } else if (entity.type === 'POLYGON') {
      const verts = entity.vertices;
      if (verts.length === 0) { c.restore(); return; }
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const v of verts) { const p = worldToScreen(v.x, v.y); if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y; if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y; }
      b = { l: minX, t: minY, r: maxX, btm: maxY };
    } else if (entity.type === 'TEXT') {
      const p = worldToScreen(entity.x, entity.y);
      const fs = (entity.fontSize || 1) * state.zoom * state.gridSize;
      b = { l: p.x - 4, t: p.y - fs - 4, r: p.x + 4, btm: p.y + 4 };
    }
    if (b) { const pad = 8; c.strokeRect(b.l - pad, b.t - pad, b.r - b.l + pad * 2, b.btm - b.t + pad * 2); }
    c.setLineDash([]);
    c.restore();
  }

  function renderSnapshot() {
    const w = canvas.width, h = canvas.height;
    snapshotCtx.fillStyle = '#1e1e2e'; snapshotCtx.fillRect(0, 0, w, h);
    drawGridTo(snapshotCtx);
    for (const e of state.entities) { drawEntityTo(snapshotCtx, e, false); }
  }

  function render() {
    if (!snapshotValid) { renderSnapshot(); snapshotValid = true; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(snapshotCanvas, 0, 0);
    if (state.selectedEntity) {
      drawEntityTo(ctx, state.selectedEntity, true);
      drawSelectionBoxTo(ctx, state.selectedEntity);
    }
  }

  function updateEntityCount() { document.getElementById('entity-count').textContent = '圖元: ' + state.entities.length; }

  function updateCursorPos(sx, sy) {
    const w = screenToWorld(sx, sy);
    document.getElementById('mouse-coords').textContent = 'X: ' + w.x.toFixed(1) + ', Y: ' + w.y.toFixed(1);
  }

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    state.mouseScreenX = sx; state.mouseScreenY = sy;
    updateCursorPos(sx, sy);
  });

  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const world = screenToWorld(sx, sy);
    const hit = hitTest(world.x, world.y);
    if (hit) {
      state.selectedEntity = hit;
      invalidateSnapshot(); render();
    } else {
      state.selectedEntity = null;
      invalidateSnapshot(); render();
    }
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const wx = (sx - state.panX) / (state.zoom * state.gridSize);
    const wy = (sy - state.panY) / (state.zoom * state.gridSize);
    state.zoom *= factor; state.zoom = Math.max(0.1, Math.min(10, state.zoom));
    state.panX = sx - wx * state.zoom * state.gridSize;
    state.panY = sy - wy * state.zoom * state.gridSize;
    invalidateSnapshot(); render();
  });

  document.getElementById('grid-toggle').addEventListener('click', function() {
    state.showGrid = !state.showGrid;
    this.classList.toggle('active', state.showGrid);
    invalidateSnapshot(); render();
  });
  document.getElementById('grid-toggle').classList.add('active');

  document.getElementById('zoom-reset').addEventListener('click', () => {
    state.zoom = 1; state.panX = 0; state.panY = 0;
    invalidateSnapshot(); render();
  });

  document.getElementById('clear-all').addEventListener('click', () => {
    state.entities.length = 0;
    state.selectedEntity = null;
    invalidateSnapshot(); render(); updateEntityCount();
    addSystemMsg('已清除所有圖元');
  });

  const executor = new Executor(state, null);
  executor.setContext(ctx);

  const chatMessages = document.getElementById('chat-messages');
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');

  function addSystemMsg(text, extra) {
    const div = document.createElement('div');
    div.className = 'msg system';
    let html = '<div class="bubble">' + text;
    if (extra) html += extra;
    html += '</div>';
    div.innerHTML = html;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function addUserMsg(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div>';
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
  }

  async function sendCommand() {
    const text = chatInput.value.trim();
    if (!text) return;
    addUserMsg(text);
    chatInput.value = '';
    sendBtn.disabled = true;

    try {
      const resp = await fetch('http://127.0.0.1:8000/api/parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, entities: state.entities })
      });
      const data = await resp.json();
      const commands = data.commands;

      let extraHtml = '<div class="json-block">' + escapeHtml(JSON.stringify(commands, null, 2)) + '</div>';
      let allSuccess = true;
      let detailHtml = '';
      for (const cmd of commands) {
        const r = executor.executeCommand(cmd);
        invalidateSnapshot(); render(); updateEntityCount();
        if (r.success) {
          detailHtml += '<div class="detail result-ok">✓ ' + escapeHtml(r.message) + '</div>';
        } else {
          detailHtml += '<div class="detail result-fail">✗ ' + escapeHtml(r.message) + '</div>';
          allSuccess = false;
        }
      }
      extraHtml += detailHtml;
      extraHtml += '<span class="timestamp">' + new Date().toLocaleTimeString('zh-TW') + '</span>';
      addSystemMsg('', extraHtml);
    } catch (err) {
      addSystemMsg('<span class="result-fail">✗ 連線錯誤: ' + escapeHtml(err.message) + '</span>');
    }

    sendBtn.disabled = false;
    chatInput.focus();
  }

  sendBtn.addEventListener('click', sendCommand);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendCommand();
  });

  function animate() {
    render();
    requestAnimationFrame(animate);
  }

  updateEntityCount();
  animate();
})();
</script>
</body>
</html>
