# ============================================================
# freeCivilCAD — Vercel 自動部署
# 當推送到 master 分支時，建置前端並部署到 Vercel Production
# ============================================================
name: Deploy to Vercel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: 建置 + 部署
    runs-on: ubuntu-latest

    # 此 job 需要的權限：讀取 repo 內容 + 寫入 deployments（用於 GitHub Deployment API）
    permissions:
      contents: read
      deployments: write

    steps:
      # --------------------------------------------------
      # 步驟 1：檢出程式碼
      # --------------------------------------------------
      - name: 檢出程式碼
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 步驟 2：設定 Node.js 環境（前端建置需要）
      # --------------------------------------------------
      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --------------------------------------------------
      # 步驟 3：安裝前端相依套件
      # --------------------------------------------------
      - name: 安裝前端相依套件
        run: npm --prefix frontend ci
        env:
          # 避免 postinstall 腳本可能需要的 GitHub Auth
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # --------------------------------------------------
      # 步驟 4：建置前端（Vite）
      # --------------------------------------------------
      - name: 建置前端
        run: npm --prefix frontend run build

      # --------------------------------------------------
      # 步驟 5：部署到 Vercel（使用 Vercel CLI）
      # --------------------------------------------------
      - name: 部署到 Vercel Production
        run: |
          npx vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes
        env:
          # Vercel CLI 在部分環境需 GitHub Auth 做關聯
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
